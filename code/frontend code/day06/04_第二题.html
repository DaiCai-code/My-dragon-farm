<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业3</title>
  <style>
    table {
      /* 设置表格的宽度 */
      width: 60%;
      /* 将表格边框合并，消除单元格之间的间距 */
      border-collapse: collapse;
      /* 将表格边框间的距离设置为0，确保没有任何间距 */
      border-spacing: 0;
      /* 文本居中对齐 */
      text-align: center;
      /* 版心居中展示 */
      margin: auto;
      /* 距离顶部的外边距 */
      margin-top: 20px;
      /* 行高 */
      line-height: 30px;
      /* 字体 */
      font-family: 'Courier New', 华文中宋, monospace;
    }

    table,
    tr,
    th,
    td {
      /* 设置表格的边框 */
      border: 1px solid black;
    }

    div {
      /* 文本居中对齐 */
      text-align: center;
    }
  </style>
</head>

<body>
  <div style="font-size: 30px; text-align: center;" id="tb1">课程表</div>
  <table width="800px" border="1" cellspacing="0" align="center">
    <tr>
      <th>学号</th>
      <th>姓名</th>
      <th>分数</th>
      <th>评语</th>
    </tr>
    <tr align="center" class="data">
      <td>001</td>
      <td>张三</td>
      <td>90</td>
      <td>很优秀</td>
    </tr>
    <tr align="center" class="data">
      <td>002</td>
      <td>李四</td>
      <td>92</td>
      <td>优秀</td>
    </tr>
    <tr align="center" class="data">
      <td>003</td>
      <td>王五</td>
      <td>83</td>
      <td>很努力,不错</td>
    </tr>
    <tr align="center" class="data">
      <td>004</td>
      <td>赵六</td>
      <td>98</td>
      <td>666</td>
    </tr>
  </table>

  <br>

    <div style="text-align: center;">
        <input id="b1" type="button" value="改变标题内容">
        <input id="b2" type="button" value="改变标题颜色">
        <input id="b3" type="button" value="删除最后一行">
    </div>
</body>

<script>
  let btn1 = document.querySelector("#b1")
  let titil = document.querySelector("#tb1")
  btn1.addEventListener(
    "click",
    () => {
      titil.innerHTML = "学生成绩表"
    }
  )
  let btn2 = document.querySelector("#b2")
  btn2.addEventListener(
    "click",
    () => {
      titil.style.color = "red"
    }
  )
let btn3 = document.querySelector("#b3")
btn3.addEventListener(
    "click",
    () => {
      let trs = document.querySelectorAll("tr")
      if(trs.length>1){
        trs[trs.length - 1].remove()
      }
    }
  )


</script>

</html>
