<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-事件-练习</title>
</head>

<body>

    <img id="light" src="images/off.gif"> <br>

    <!-- <input type="button" value="点亮" id="on">
    <input type="button" value="熄灭" id="off"> -->
    <button id="btn">开灯</button>

    <br> <br>

    <input type="text" id="name" value="ITCAST">

    <br> <br>

    <input type="checkbox" name="hobby"> 电影
    <input type="checkbox" name="hobby"> 旅游
    <input type="checkbox" name="hobby"> 游戏

    <br> <br>

    <input type="button" value="全选">
    <input type="button" value="反选">

</body>

<script>
    //1. 点击 "点亮" 按钮, 点亮灯泡; 点击 "熄灭" 按钮, 熄灭灯泡; -- click
    //1.找到一个按钮和一个图片
    let light = document.querySelector("#light");
    let btn = document.querySelector("#btn");
    let isLight = false;
    btn.addEventListener("click", () => {
        isLight = !isLight;
        if (isLight) {
            light.src = "./images/on.gif"
            btn.innerHTML = "关灯"
        } else {
            light.src = "./images/off.gif"
            btn.innerHTML = "开灯"
        }
    })

    /*
        1.找到点亮和熄灭的按钮, 分别绑定单击事件

        2. 点击点亮, 给图片换成亮光的图片, 点击熄灭,.....
    */
    /* let btnOn = document.querySelector("#on");
    let btnOff = document.querySelector("#off");
    let light = document.querySelector("#light");
    btnOn.addEventListener("click", () => {
        light.src = "./images/on.gif"
    })
    btnOff.addEventListener("click", () => {
        light.src = "./images/off.gif"
    }) */
    //2. 输入框聚焦后, 展示小写; 输入框离焦后, 展示大写; -- focus , blur
    //1.找到输入框, 2.绑定获取焦点和失去焦点事件, 然后做操作
    let input = document.querySelector("#name");
    input.addEventListener("focus", () => {
        input.value = input.value.toLowerCase();
    })
    input.addEventListener("blur", () => {
        input.value = input.value.toUpperCase();
    })
    //3. 点击 "全选" 按钮使所有的复选框呈现选中状态 ; 点击 "反选" 按钮使所有的复选框呈现取消勾选的状态 ; -- onclick
    //1.找到全选和反选
    let btnSelect = document.querySelector("input[value='全选']");
    let revSelect = document.querySelector("input[value='反选']");
    let hobbies = document.querySelectorAll("input[name='hobby']");


    btnSelect.addEventListener(
        "click",
        () => {
            hobbies.forEach(
                hobby => {
                    hobby.checked = true
                }
            )
        }
    )
    revSelect.addEventListener(
        "click",
        () => {
            hobbies.forEach(
                hobby => {
                    hobby.checked = !hobby.checked
                }
            )
        }
    )


</script>

</html>
