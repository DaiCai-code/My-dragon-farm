<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        input {
            width: 300px;
            height: 40px;
            padding: 0;
            margin: 0;
            border: 1px solid #de9662;
            /* 去掉输入框的默认选中的效果 */
            outline: none;
        }

        div {
            width: 300px;
            height: 400px;
            border: 1px solid #de9662;
            display: none;
        }
    </style>
</head>

<body>

    <input type="text">
    <div>

    </div>


    <!-- 
        元素display:
            inline: 行内
            block: 块
            inline-block: 行内块
            none: 隐藏元素
    -->
    <script>
        let productNames = ["华为p1000", "华为mate90", "小米18", "小米18pro", "荣耀win", "荣耀winRT", "红米K100"];
        let input = document.querySelector("input");
        input.addEventListener(
            "focus",
            () => {
                let div = document.querySelector("div");
                div.style.display = "block";
                let productContent = "";
                productNames.forEach(
                    productName => {
                        productContent += `<li>${productName}</li>`
                    }
                )
                div.innerHTML = productContent;
            }
        )
    </script>


</body>

</html>
