<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>搜索下拉提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 32px;
        }
        .search-wrap {
            width: 400px;
            margin: 30px auto;
            border: 2px solid orange;
            border-radius: 2px;
        }
        #search-input {
            width: 100%;
            padding: 20px;
            border: none;
            outline: none;
        }
        /* 获得焦点时添加的样式 */
        #search-input.active {
            background-color: #fff8e8;
        }
        .search-list {
            display: none; /* 初始隐藏下拉框 */
            border-top: 2px solid orange;
        }
        .search-list div {
            padding:15px 20px;
        }
    </style>
</head>
<body>
    <div class="search-wrap">
        <input type="text" id="search-input" value="小米笔记本">
        <div class="search-list" id="search-menu">
            <div>全部商品</div>
            <div>小米11</div>
            <div>小米10S</div>
            <div>小米笔记本</div>
            <div>小米手机</div>
            <div>黑鲨4</div>
            <div>空调</div>
        </div>
    </div>

<script>
    const input = document.getElementById('search-input');
    const menu = document.getElementById('search-menu');

    // 获取焦点事件 focus
    input.addEventListener('focus', function(){
        menu.style.display = 'block';  // 显示下拉菜单
        this.classList.add('active');  // 添加类，改变输入框颜色
    })

    // 失去焦点事件 blur
    input.addEventListener('blur', function(){
        menu.style.display = 'none';   // 隐藏下拉菜单
        this.classList.remove('active'); // 移除类，恢复原色
    })
</script>
</body>
</html>
