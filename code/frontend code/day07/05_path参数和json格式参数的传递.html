<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!--1. 导入axios的js文件-->
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    // 路径参数的使用
    axios.get(`https://hmajax.itheima.net/api/books/987491` ).then(
      resp => {
        console.log(resp.data);
      }
    )
    // json格式参数的使用，post请求
    let book = {
    "bookname": "《黑马程序员》",
    "author": "小马",
    "publisher": "北京出版社",
    "creator": "老李"
    }
    axios.post("https://hmajax.itheima.net/api/books", book).then(
      resp => {
        console.log(resp.data);
      }
    )
  </script>
</body>

</html>
