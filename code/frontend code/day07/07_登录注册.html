<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <!-- 引入bootstrap.css -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <style>
        html,
        body {
            background-color: #EDF0F5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 520px;
            height: 540px;
            background-color: #fff;
            padding: 60px;
            box-sizing: border-box;
        }

        .container h3 {
            font-weight: 900;
        }
    </style>
    <!-- 表单容器和内容 -->
    <style>
        .form_wrap {
            color: #8B929D !important;
        }

        .form-text {
            color: #8B929D !important;
        }
    </style>
    <!-- 提示框样式 -->
    <style>
        .alert {
            transition: .5s;
            opacity: 0;
        }

        .alert.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>欢迎-注册</h3>
        <!-- 表单 -->
        <div class="form_wrap">
            <form>
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control username" placeholder="请输入用户名" id="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control password" placeholder="请输入密码" id="password">
                </div>
                <button type="button" class="btn btn-primary btn-register" id="register"> 立即注册 </button>
            </form>
        </div>
    </div>
    <!-- 导入axios的js文件 -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
        //1.找到立即注册按钮
        let registerBtn = document.querySelector("#register");
        let usernameInput = document.querySelector("#username");
        let passwordInput = document.querySelector("#password");
        //2.绑定单击事件
        registerBtn.addEventListener(
            "click",
            () => {
                let username = usernameInput.value;
                let password = passwordInput.value;
                let user = {
                    username: username,
                    password: password
                }
                //3.发送请求
                axios.post("https://hmajax.itheima.net/api/register", user).then(
                    resp => {
                        if (resp.data.code == 10000) {
                            alert("注册成功");
                            location.href = "./06_省市区联动.html"
                        } else if (resp.data.code == 10002) {
                            alert("密码位数不够")
                        } else if (resp.data.code == 10003) {
                            alert("用户名位数不够")
                        } else if (resp.data.code == 10005) {
                            alert("用户名已存在")
                        }
                    }
                ).catch(
                    err => {
                        console.log(err);
                        alert("账号已存在")
                    }
                )
            }
        )

    </script>
</body>

</html>
