<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!--1. 必须先导入axios的js文件    （这个你最好从官网上自己去取）-->
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    //2.使用它内置的一个对象axios对象方法来发送请求
    //axios.请求方式（请求的路径）.then（成功的函数）.catch（失败的函数）
    axios.get("https://hmajax.itheima.net/api/province").then(
      (res) => {
        console.log(res.data);
      }
    ).catch(
      (err) => {
        console.log(err);
      }
    )
  </script>
</body>
</html>
