    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
        //-----------------------------需求：查询城市----------------------------------
        let cities = []
        axios.get('https://hmajax.itheima.net/api/weather/city?city=').then(resp => {
            console.log(resp.data)
            cities = resp.data.data;
        })
        //在输入框输入内容的时候, 展示所有的城市
        let searchInput = document.querySelector("#search-city");
        let cityNoticeContainer = document.querySelector("#city_notice_container");
        searchInput.addEventListener("input", () => {
            //显示输入框
            cityNoticeContainer.style.display = "block";
            //获取搜索框输入的内容
            let search = searchInput.value;
            //找到搜索框下面展示提示内容的区域
            let cityContent = "";
            cities.forEach(item => {
                if (item.name.startsWith(search)) {
                    cityContent += `<li class='list-style'>${item.name}<li>`
                }
            })
            //将所有的li插入到cityNoticeContainer中即可
            cityNoticeContainer.innerHTML = cityContent;
        })

        //-----------------------------需求：查询天气----------------------------------


    </script>
