<script>
  //switch语句格式买水果，苹果10元/斤，香蕉15元/斤，橙子20元/斤，榴莲30元/斤
  let fruit = prompt('请输入你要购买的水果')
  switch(fruit){
    case '苹果':
      alert('你购买了苹果，价格为10元/斤')
      break
    case '香蕉':
      alert('你购买了香蕉，价格为15元/斤')
      break
    case '橙子':
      alert('你购买了橙子，价格为20元/斤')
      break
    case '榴莲':
      alert('你购买了榴莲，价格为30元/斤')
      break
    default:
      alert('你购买的水果不在列表中')
  }
</script>
</html>
