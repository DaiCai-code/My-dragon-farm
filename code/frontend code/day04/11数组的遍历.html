  <title>数组的遍历</title>

<script>
  //定义一个人名的数组
  let names = ['张三','李四','王五','赵六','王二','王三','王四']
  //遍历数组
  for(let i = 0;i <= names.length;i++){
    document.write(names[i])
  }
</script>
