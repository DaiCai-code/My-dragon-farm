<script>
  //start和end属于形式参数
  //100,200,300,400属于实际参数
  function getSum(start,end){
    let sunm = 0
    for(let i = start;i<=end;i++){
      sunm += i
    }
    alert(sunm)
  }
  getSum(1,100)
  getSum(100,200)
  getSum(200,300)
  getSum(300,400)
</script>
