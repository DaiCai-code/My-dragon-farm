<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数组的定义与使用</title>
</head>
<body>
  
</body>
<script>
  //定义一组人名数组
  let names = ['张三','李四','王五','赵六']
  //使用数组的元素
  document.write(names[0])//张三
  document.write('<br>')
  document.write(names[1])//李四
  document.write('<br>')
  document.write(names[2])//王五
  document.write('<br>')  
  document.write(names[3])//赵六
  document.write('<br>')
  document.write(names.length)//打印数组长度
  document.write('<br>')
  document.write(names[4])//undefined
  document.write('<br>')
  document.write(names)//打印整个数组
  
</script>
</html>
