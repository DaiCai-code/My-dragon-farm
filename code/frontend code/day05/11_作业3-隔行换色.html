<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业3 - 表格隔行换色</title>
  <style>
    .title {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 6px 24px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="title">课程表</div>

  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>分数</th>
        <th>评语</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>001</td>
        <td>张三</td>
        <td>90</td>
        <td>很优秀</td>
      </tr>
      <tr>
        <td>002</td>
        <td>李四</td>
        <td>92</td>
        <td>优秀</td>
      </tr>
      <tr>
        <td>003</td>
        <td>王五</td>
        <td>83</td>
        <td>很努力,不错</td>
      </tr>
      <tr>
        <td>004</td>
        <td>赵六</td>
        <td>98</td>
        <td>666</td>
      </tr>
    </tbody>
  </table>

  <script>
    // 只拿数据行（tbody 里的 tr），表头那行不参与
    const rows = document.querySelectorAll('tbody tr')

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i]

      // 鼠标移入：奇数行 #FFFFBE，偶数行 #C2C2FF
      row.addEventListener('mouseover', function () {
        // i 从 0 开始，人眼数的行号是 i + 1
        // i % 2 === 0 对应第 1、3 行（奇数行）
        if (i % 2 === 0) {
          row.style.backgroundColor = '#FFFFBE'
        } else {
          row.style.backgroundColor = '#C2C2FF'
        }
      })

      // 鼠标移出：不管奇偶，统一恢复白色
      row.addEventListener('mouseout', function () {
        row.style.backgroundColor = '#FFFFFF'
      })
    }
  </script>
</body>

</html>
