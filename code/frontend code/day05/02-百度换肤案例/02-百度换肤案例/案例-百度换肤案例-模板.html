<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Title</title>
  <!-- 讲解视频链接：https://www.bilibili.com/video/BV1mS4y1j7YZ?p=21 -->
  <style>
    * {
      margin: 0px;
      padding: 0px;
    }

    body {
      background-image: url(./images/bg1.jpg);
    }

    #mask {
      background-color: rgba(255, 255, 255, 0.3);
      height: 200px;
      text-align: center;
    }

    #mask img {
      width: 200px;
      margin-top: 35px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="mask">
    <img src="./images/bg1.jpg" alt="" />
    <img src="./images/bg2.jpg" alt="" />
    <img src="./images/bg3.jpg" alt="" />
    <img src="./images/bg4.jpg" alt="" />
    <img src="./images/bg5.jpg" alt="" />
  </div>

  <script>
    // 1、找到每一个img标签，注册点击事件
    // 2、点击之后，把img标签的src属性直接设置给body标签的backgroundImage即可

    // 第一步：找出 #mask 里所有的 img
    // querySelectorAll 返回的是一个"伪数组"(NodeList)，有 length，可以用下标 [i] 取每一项
    const imgs = document.querySelectorAll('#mask img')

    // 第二步：遍历，给每一个 img 注册点击事件
    for (let i = 0; i < imgs.length; i++) {
      imgs[i].addEventListener('click', function () {
        // 这里必须用 function，不能用箭头函数 () => {}
        // 因为只有在 function 里，this 才指向"当前触发事件的那个 img"
        // 箭头函数没有自己的 this，会往外层找，this.src 就变成 undefined 了
        document.body.style.backgroundImage = `url(${this.src})`
      })
    }
  </script>
</body>

</html>
