<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css的引入方式</title>
  <!-- <style>
      /* 内部样式引入css 
    1. 直接在head标签内部使用style标签
    2. 在style标签中定义修饰的内容
       a{修饰的样式}
    a{
      color: rgb(26, 241, 101);
      text-decoration: none;
    }  */
  </style> -->

  <link rel="stylesheet" href="./css/css_demo.css">

</head>
<body>
<!-- 行内样式：直接在标签内使用style属性，在style属性中来写对应的样式
  <a href="" style="text-decoration: overline;">这是第一种引入方式</a>
  <a href="" style="text-decoration: underline;">这是第一种引入方式</a>
  <a href="" style="text-decoration: line-through;">这是第一种引入方式</a> -->

  <!-- 
  <a href="">这是第二种引入方式</a>
  <a href="">这是第二种引入方式</a>
  <a href="">这是第二种引入方式</a> 
  -->
  
<!-- 外部样式引入css 
    1. 在head标签内部使用link标签
    2. 在link标签中定义修饰的内容
       rel="stylesheet"
       href="css_demo.css"
       ./ :当前所在的目录
       ../ :当前目录的上一级目录  -->

  <a href="">这是第三种引入方式</a>
  <a href="">这是第三种引入方式</a>
  <a href="">这是第三种引入方式</a>

</body>
</html>
