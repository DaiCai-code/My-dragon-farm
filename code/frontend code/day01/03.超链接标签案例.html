<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超链接案例</title>
</head>

<body>
  <!-- 标签：
   <a href="....." target=".....">央视网</a>
  属性：
    - href: 指定资源访问的url
    - target: 指定在何处打开资源链接
      - _self: 默认值，在当前页面打开
      - _blank: 在空白页面打开
       -->
  <a href="https://www.baidu.com">这是一个超链接</a> 
  <a href="https://www.taobao.com">这是一个超链接</a>
  <a href="" target="_self">这是第三个超链接</a>
  <a href="https://www.taobao.com" target="_blank">这是第四个超链接</a>
  
</body>

</html>
