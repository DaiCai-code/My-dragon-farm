<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>容器标签</title>
  <style>
    div{
      color: red;
      font-size: 20px;
      font-weight: bold;
      background-color: #e5f5e8;
    }
    span{
      color: rgb(178, 178, 178);
      font-size: 16px;
      font-weight: bold;
      background-color: #df0da7;
    }
  </style>
</head>
<body>
  <div>今天天气不错</div>
  <div>我想出去走走</div>

  <span>今天天气不错</span>
  <span>我想出去走走</span>
</body>
</html>
