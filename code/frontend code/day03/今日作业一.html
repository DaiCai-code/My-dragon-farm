<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
   <!-- /* 
      需求：用户输入一个整数，判断这个数是4的倍数，并且不是100的倍数，如果是则页面弹出true，否则弹出 false。
      分析：
        1、使用prompt()键盘录入一个整数
        2、使用三元运算符判断这个数是4的倍数，并且不是100的倍数。
        3、使用alert()弹出判断结果。
    */ -->

    <script>
      let num = Number(prompt('请输入一个整数'))
      alert(num % 4 == 0 && num % 100 != 0)
      
    </script>
</body>
</html>
