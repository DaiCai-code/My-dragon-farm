<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自增自减运算符</title>
</head>
<body>
  
</body>
<script>
  //自增自减运算符++，--
  //++：将变量的值增加1，返回新的值
  let a = 10
  a++
  document.write(a)
  document.write('<br>')
  //--：将变量的值减少1，返回新的值
  a--
  document.write(a)
  document.write('<br>')
  //++或--写在前面，先运算再赋值，++或--写在后面，先赋值再运算
  let num1,num2,num3
  num2 = 10
  num3 = 20
  num1 = num2++ + num3++ + ++num2 + num3--
  //      10   +   20   +    12   +   21
  //                         12       20
  document.write(num1)
  document.write('<br>')
  document.write(num2)
  document.write('<br>')
  document.write(num3)
  document.write('<br>')
</script>

</html>
