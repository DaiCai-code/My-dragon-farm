<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js中的字面量</title>
</head>
<body>
  
</body>

<script>
  //字符串字面量
  document.write('hello world')
  document.write('<br>')
  //整数字面量
  document.write(123)
  document.write('<br>')
  //小数字面量
  document.write(123.456)
  document.write('<br>')
  //布尔值面量
  document.write(true)
  document.write('<br>')
  document.write(false)
  document.write('<br>')
  //null字面量
  document.write(null)
  document.write('<br>')

</script>
</html>
