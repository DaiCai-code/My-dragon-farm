<script>
  //比较运算符:>,<,>=,<=,==,!=
  let a = 10
  let b = 20
  // document.write(a > b)

  // document.write('<br>')
  //js特有的比较运算符：===,!==，比较数值和类型是否全相等
  document.write(a === b)//false
  document.write('<br>')
  document.write(a === "10")//false
  document.write('<br>')
  document.write(a === 10)//true
  document.write('<br>')
  document.write(a !== b)//true
</script>
