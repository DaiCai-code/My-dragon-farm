<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赋值运算符</title>
</head>
<body>
  
</body>
<script>
  //赋值运算符：+=，-=，*=，/=，%=
  let a = 10
  a += 10
  document.write(a)
  document.write('<br>')
  a -= 10
  document.write(a)
  document.write('<br>')
  a *= 2
  document.write(a)
  document.write('<br>')
  a /= 2
  document.write(a)
  document.write('<br>')
  a %= 2
  document.write(a)
  document.write('<br>')
</script>


</html>
