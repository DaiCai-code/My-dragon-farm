<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>变量操作</title>
</head>
<body>
  
</body>

<script>
  //变量的声明
  let a = 10
  //变量的赋值
  a = 20
  //变量的更改
  a = 40
  //变量的使用
  document.write(a)
  //声明一个字符串变量
  let str = 'hello world'
  document.write(str)
  document.write('<br>')
  //声明一个布尔值变量
  let bool = true
  document.write(bool)
  document.write('<br>')
  //生命一个整数变量
  let num = 123
  document.write(num)
  document.write('<br>')

</script>
</html>
