<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能学习辅助系统</title>

  <style>
    .box1 {
      display: flex;
      justify-content: space-between;
      background-color: rgb(170, 170, 170);
      color: white;
      line-height: 40px;
      font-family: 楷体;
      font-weight: bold;
    }

    .title {
      margin-left: 20px;
    }

    .logout {
      margin-right: 20px;
    }

    .box2 {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    input,
    select {
      width: 200px;
      height: 23px;
      box-sizing: border-box;
    }

    .button {
      width: 50px;
      height: 25px;
      background-color: rgb(135, 166, 222);
      color: white;
      border: none;
    }

    .box3 {
      margin-top: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      text-align: center;
    }

    th {
      background-color: rgb(241, 241, 241);
    }

    th,
    td {
      border: 1px solid black;
      height: 40px;
    }

    td button {
      background-color: rgb(243, 204, 145);
      border: none;
      color: white;
    }

    img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .box4 {
      margin-top: 50px;
      text-align: center;
      color: white;
      line-height: 30px;
      background-color: rgb(215, 215, 215);
    }
    .parent-box{

      width: 80%;
