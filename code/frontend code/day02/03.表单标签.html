<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单标签</title>
</head>
<body>
  <form action="https://www.baidu.com/" method="get">
    姓名：<input type="text" name="username" placeholder="请输入姓名">
    <br>
    年龄：<input type="number" name="age" placeholder="请输入年龄">
    <br>
    密码：<input type="password" name="password" placeholder="请输入密码">
    <br>
    性别：男<input type="radio" name="gender" value="man">
    女<input type="radio" name="gender" value="woman">
    <br>
    爱好：唱<input type="checkbox" name="hobby" value="sing">
    跳<input type="checkbox" name="hobby" value="dance">
    rap<input type="checkbox" name="hobby" value="rap">
    篮球<input type="checkbox" name="hobby" value="basketball">
    <br>
    职位：<select name="position">
      <option value="">请选择</option>
      <option value="teacher">教师</option>
      <option value="student">学生</option>
      <option value="assistant">助手</option>
    </select>
    <br>
    自我介绍：<textarea name="selfIntroduction" value="" placeholder="请输入自我介绍" cols="10" rows="10"></textarea>
    <br>
    <input type="submit"><input type="reset"><input type="button">
    
  </form>
</body>
</html>
