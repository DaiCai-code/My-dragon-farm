<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff;
        }
        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
        }
        .header h1 {
            font-size: 32px;
            color: #111;
        }
        .logout {
            font-size: 20px;
            color: #3b82f6;
            text-decoration: none;
        }
        /* 查询区域 */
        .search-area {
            padding:25px 30px;
            display: flex;
            align-items: center;
            gap:12px;
        }
        .search-area input, .search-area select{
            padding: 8px 10px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:4px;
        }
        .btn-search{
            background-color:#2563eb;
            color:#fff;
            border:none;
            padding:9px 22px;
            border-radius:4px;
            font-size:16px;
        }
        .btn-clear{
            background-color:#6b7280;
            color:#fff;
            border:none;
            padding:9px 22px;
            border-radius:4px;
            font-size:16px;
        }
        /* 表格 */
        table{
            width: calc(100% - 60px);
            margin:0 30px;
            border-collapse: collapse;
        }
        th,td{
            text-align:center;
            padding:16px 8px;
            border-bottom:1px solid #e5e7eb;
            font-size:18px;
        }
        th{
            background-color:#f8fafc;
        }
        .status-ok{
            color:#22a722;
            font-weight:bold;
        }
        .status-no{
            color:#dc2626;
            font-weight:bold;
        }
        .btn-edit{
            background-color:#28a745;
            color:white;
            border:none;
            padding:7px 12px;
            border-radius:4px;
            margin:0 4px;
        }
        .btn-del{
            background-color:#dc3545;
            color:white;
            border:none;
            padding:7px 12px;
            border-radius:4px;
        }
        /* 底部版权 */
        footer{
            margin-top:30px;
            background-color:#6c757d;
            color:white;
            text-align:center;
            padding:25px;
            font-size:18px;
        }
    </style>
</head>
<body>
    <!--顶部标题栏-->
    <div class="header">
        <h1>图书管理系统</h1>
        <a href="#" class="logout">退出登录</a>
    </div>

    <!--搜索筛选区-->
    <div class="search-area">
        <span>书名</span>
        <input type="text" placeholder="请输入书名">
        <span>作者</span>
        <input type="text" placeholder="请输入作者">
        <span>分类</span>
        <select>
            <option>全部</option>
            <option>文学</option>
            <option>科技</option>
            <option>历史</option>
            <option>艺术</option>
        </select>
        <span>状态</span>
        <select>
            <option>全部</option>
            <option>可借出</option>
            <option>已借出</option>
        </select>
        <button class="btn-search">查询</button>
        <button class="btn-clear">清空</button>
    </div>

    <!--图书表格-->
    <table>
        <thead>
            <tr>
                <th>图书编号</th>
                <th>书名</th>
                <th>作者</th>
                <th>分类</th>
                <th>出版社</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001</td>
                <td>红楼梦</td>
                <td>曹雪芹</td>
                <td>文学</td>
                <td>人民文学出版社</td>
                <td class="status-ok">可借出</td>
                <td>
                    <button class="btn-edit">编辑</button>
                    <button class="btn-del">删除</button>
                </td>
            </tr>
            <tr>
                <td>002</td>
                <td>西游记</td>
                <td>吴承恩</td>
                <td>文学</td>
                <td>中华书局</td>
                <td class="status-no">已借出</td>
                <td>
                    <button class="btn-edit">编辑</button>
                    <button class="btn-del">删除</button>
                </td>
            </tr>
            <tr>
                <td>003</td>
                <td>时间简史</td>
                <td>霍金</td>
                <td>科技</td>
                <td>湖南科学技术出版社</td>
                <td class="status-ok">可借出</td>
                <td>
                    <button class="btn-edit">编辑</button>
                    <button class="btn-del">删除</button>
                </td>
            </tr>
            <tr>
                <td>004</td>
                <td>史记</td>
                <td>司马迁</td>
                <td>历史</td>
                <td>中华书局</td>
                <td class="status-ok">可借出</td>
                <td>
                    <button class="btn-edit">编辑</button>
                    <button class="btn-del">删除</button>
                </td>
            </tr>
            <tr>
                <td>005</td>
                <td>艺术的故事</td>
                <td>贡布里希</td>
                <td>艺术</td>
                <td>广西美术出版社</td>
                <td class="status-no">已借出</td>
                <td>
                    <button class="btn-edit">编辑</button>
                    <button class="btn-del">删除</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!--页脚版权信息-->
    <footer>
        版权所有 © 2024 图书管理系统
    </footer>
</body>
</html>
